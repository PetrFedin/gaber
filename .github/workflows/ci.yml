name: Check Gaber
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: gaber-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Dependency install
        run: npm ci
      - name: Domain, geometry and render tests
        run: npm test
      - name: Production build
        run: npm run build
