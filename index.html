<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="theme-color" content="#f7f6f2" />
    <meta
      name="description"
      content="GABER — цифровое ателье мягкой мебели. Настройте диван, кресло, кровать или изголовье, изучите конструкцию и сохраните проект."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>GABER — мебель, созданная вами</title>
    <script>try{var t=localStorage.getItem("gaber.theme");if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t}catch(e){}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
